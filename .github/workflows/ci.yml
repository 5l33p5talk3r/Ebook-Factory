name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck application
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Validate Cloudflare Worker
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run
