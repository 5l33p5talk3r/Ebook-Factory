services:
  - type: web
    name: ebook-factory
    runtime: node
    plan: free
    region: ohio
    branch: production-hardening
    buildCommand: npm ci --include=dev && npm run typecheck && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://ebookfactory.org
      - key: APP_ORIGIN
        value: https://ebookfactory.org
      - key: TRUST_PROXY
        value: "true"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_SECRET
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
