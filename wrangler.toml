name = "ebook-factory"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "ebook-factory-db"
database_id = "YOUR_D1_DATABASE_ID"

[vars]
ENVIRONMENT = "production"
# Set secrets via wrangler secret put GEMINI_API_KEY
# Set secrets via wrangler secret put PAYPAL_CLIENT_ID
# Set secrets via wrangler secret put PAYPAL_CLIENT_SECRET
